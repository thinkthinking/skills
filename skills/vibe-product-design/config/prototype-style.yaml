# ============================================================================
# 原型图风格配置（vibe-product-design · 模式 B 高保真原型图）
# ----------------------------------------------------------------------------
# 你只需要写一个「风格主题」——一句话描述你想要的视觉风格即可，剩下的（配色、
# 字体、留白、组件质感……）由 skill 的**预处理步骤**用大模型自动展开成一份
# 「风格提示词文件」，之后出图时自动加载。你不用手填一堆细节字段。
#
# 工作流：
#   active_theme（你写的一句话主题）
#     → 预处理：大模型据主题生成 config/generated/<slug>.style.md（风格提示词，缓存）
#     → 加载：出图时把该风格提示词拼在每张图的具体画面描述之前
#     → 交给 zenmux-image-generation 出图
#
# 换风格：改下面的 active_theme 就行。可以：
#   1) 直接写一句自由主题，如   active_theme: 赛博朋克霓虹，暗色高对比，电子感
#   2) 或引用 themes: 里的一个预设 key（文件名更干净、可复用），如 active_theme: kenya-hara
# 换了主题后重跑一次，预处理会自动为新主题生成对应的风格提示词文件。
# ============================================================================

# 当前生效的风格主题。默认原研哉 / 无印良品。
# —— 写成 themes: 里的 key（推荐，缓存文件名可读），或直接写一句自由主题文本都行。
active_theme: kenya-hara

# 可选的主题预设：key 是短名（决定缓存文件名），value 是一句话主题描述。
# 想复用/命名自己的风格就在这里加一行；只想临时试一下就直接改上面的 active_theme 为自由文本。
themes:
  kenya-hara: 原研哉 (Kenya Hara) / 无印良品 (MUJI) 极简美学——克制、大面积留白、温润中性配色、安静内敛，让信息层级自己浮现
  dieter-rams: Dieter Rams「Less, but better」功能主义——理性、精确、少即是多，克制的单一强调色
  bold-playful: 年轻明快、友好活泼的消费级界面——鲜明主色、圆角卡片、饱满按钮，有亲和力
  dark-pro: 深色专业数据仪表盘——沉浸暗色背景、高信息密度、克制的强调色标注关键数据与状态

# 出图的模型与参数（所有主题通用）。界面稿含大量中文文案 + 精细排版，对文字渲染
# 要求高，故默认高质量模型 + high；别用 fast/low 档，易糊字错字。
rendering:
  # 多语言文字渲染与复杂版面最稳；也可换 openai/gpt-image-2。
  model: google/gemini-3-pro-image-preview
  quality: high            # openai/* 模型会转成 --quality high；密集文字必须 high
  size:
    mobile: 1024x1536      # 竖版手机界面
    web: 1536x1024         # 桌面 Web / 横版
    square: 1024x1024      # 方形卡片 / 组件特写
